[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-integrity"
version = "0.1.0"
description = "Self-hosted file-integrity monitor + OpenTimestamps notary with a web panel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Max Kuminov" }]
dependencies = [
    # Kept in lockstep with requirements.txt — see the rationale for each floor there.
    "fastapi>=0.139",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.50",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiosqlite>=0.22",
    "alembic>=1.18",
    "pydantic-settings>=2.14.2",
    "itsdangerous>=2.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "pyyaml>=6.0.3",
    "opentimestamps-client>=0.7.2",
    "gitpython>=3.1.60",
]

[project.scripts]
cairn = "src.cli:main"

[tool.setuptools]
packages = [
    "src",
    "src.models",
    "src.services",
    "src.notify",
    "src.witness",
    "src.auth",
    "src.api",
    "src.control_panel",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pin the rule set explicitly. Ruff's *default* selection widened in 0.16, which turned a green
# gate red overnight with 132 findings the project never opted into — 56 of them B008 firing on
# FastAPI's `Depends()` default-argument idiom, which is correct usage here, not a defect. An
# implicit gate that changes meaning on a dependency bump is not a gate. Widening the selection is
# a deliberate decision to make on its own, not a side effect of upgrading the linter.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
